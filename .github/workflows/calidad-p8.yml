name: Calidad P8

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calidad-p8-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validations:
    name: Validaciones (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [client, server]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ranti_test
          POSTGRES_PASSWORD: ranti_ci_disposable
          POSTGRES_DB: ranti_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ranti_test -d ranti_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: 'true'
      TEST_DATABASE_URL: postgres://ranti_test:ranti_ci_disposable@127.0.0.1:5432/ranti_test
      RANTI_EPHEMERAL_DB: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json
      - name: Instalar dependencias de los tres paquetes
        id: install
        run: npm run ci:install
      - name: Preparar directorio de evidencias
        if: always()
        run: mkdir -p reports/quality-p8
      - name: ESLint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint --prefix ${{ matrix.project }} 2>&1 | tee reports/quality-p8/${{ matrix.project }}-lint.log
      - name: Typecheck de JavaScript con checkJs
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck --prefix ${{ matrix.project }} 2>&1 | tee reports/quality-p8/${{ matrix.project }}-typecheck.log
      - name: Vitest y cobertura V8 (incluye integracion PostgreSQL)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:coverage --prefix ${{ matrix.project }} -- --maxWorkers=2 --reporter=default --reporter=json --outputFile=coverage/vitest-results.json 2>&1 | tee reports/quality-p8/${{ matrix.project }}-vitest.log
      - name: Compilar frontend
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.project == 'client' }}
        run: npm run build --prefix client 2>&1 | tee reports/quality-p8/client-build.log
      - name: Conservar cobertura aun cuando fallen pruebas
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-${{ matrix.project }}
          path: ${{ matrix.project }}/coverage/
          if-no-files-found: error
          retention-days: 14
      - name: Conservar registros de validacion
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: validation-${{ matrix.project }}
          path: reports/quality-p8/
          if-no-files-found: warn
          retention-days: 14

  sonar:
    name: SonarQube Cloud y Quality Gate
    needs: validations
    # Forks and Dependabot do not receive the repository's secret.
    if: >-
      ${{ !cancelled() && github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: coverage-client
          path: client/coverage
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: coverage-server
          path: server/coverage
      - name: Comprobar configuracion y preparar LCOV
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          test -n "$SONAR_TOKEN" || { echo 'Falta GitHub Secret SONAR_TOKEN'; exit 1; }
          test -n "$SONAR_PROJECT_KEY" || { echo 'Falta variable SONAR_PROJECT_KEY'; exit 1; }
          test -n "$SONAR_ORGANIZATION" || { echo 'Falta variable SONAR_ORGANIZATION'; exit 1; }
          npm run sonar:coverage
      - name: Analizar codigo y esperar Quality Gate
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
