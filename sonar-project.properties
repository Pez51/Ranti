# Public identifiers; credentials are supplied only through the environment.
sonar.projectKey=pablogiaccomo_ranti
sonar.organization=pablogiaccomo
# GitHub Actions can override these using repository variables.
# Pass those public identifiers through -Dsonar.projectKey / -Dsonar.organization.
# Authentication is supplied exclusively through the SONAR_TOKEN environment variable.
sonar.host.url=https://sonarcloud.io
sonar.projectName=RANTI
sonar.sourceEncoding=UTF-8
sonar.sources=client/src,server/src,server/server.js
sonar.tests=client/src,server/test
sonar.test.inclusions=client/src/**/*.test.*,client/src/**/*.spec.*,client/src/test/**,server/test/**
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/reports/**,**/.scannerwork/**,**/uploads/**,**/*.min.js,**/*.test.*,**/*.spec.*,client/src/test/**
sonar.javascript.lcov.reportPaths=client/coverage/sonar-lcov.info,server/coverage/sonar-lcov.info
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
